general {
    # ponytail: `;` а не `&&` — если hyprctl моргнёт, лочим всё равно
    lock_cmd = pidof hyprlock || (hyprctl switchxkblayout all 0; systemd-cat -t hyprlock hyprlock)
    before_sleep_cmd = loginctl lock-session
    # лочим и на выходе из сна: before_sleep не успевает до заморозки процессов.
    # pidof в lock_cmd делает это no-op, если лок уже стоит
    after_sleep_cmd = hyprctl dispatch dpms on; loginctl lock-session
}
